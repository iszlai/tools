<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagme</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
  <button data-tool="select" title="Select / move (V)">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3 L18 13 L12.2 13.8 L15 20.2 L12.2 21.4 L9.4 15 L6 18 Z" fill="currentColor"/></svg>
  </button>
  <button data-tool="rect" title="Box (R)">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button data-tool="arrow" title="Arrow (A)">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20 L18 6 M18 6 H11 M18 6 V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button data-tool="line" title="Line (L)">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20 L20 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button data-tool="draw" title="Freehand (P)">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 21 v-4 L15 5 l4 4 L7 21 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button data-tool="text" title="Text (T)">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5 H19 M12 5 V19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button data-tool="note" title="Text doc / markdown (D)">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8 H16 M8 12 H16 M8 16 H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="sep"></div>
  <div id="palette"></div>
</div>

<div id="zoombar">
  <button id="zout" title="Zoom out">&minus;</button>
  <button id="zlabel" title="Reset zoom to 100%">100%</button>
  <button id="zin" title="Zoom in">+</button>
  <div class="sep"></div>
  <button id="zundo" title="Undo (Cmd/Ctrl+Z)">&#8630;</button>
  <button id="zredo" title="Redo (Cmd/Ctrl+Shift+Z)">&#8631;</button>
  <div class="sep"></div>
  <button id="clear" title="Clear canvas">&#128465;</button>
</div>

<svg id="canvas" data-tool="select"><g id="scene"></g></svg>
<div id="overlay"></div>

<div id="hint">V select &middot; drag empty area = multi-select &middot; shift adds &middot; R box &middot; A arrow &middot; L line &middot; P freehand &middot; T text &middot; D doc &middot; dbl-click edits &middot; del delete &middot; &#8984;Z undo &middot; scroll pan &middot; &#8984;/ctrl+scroll zoom</div>

<script src="app.js"></script>
</body>
</html>
