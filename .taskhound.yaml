    - id: TH-3
      title: diagme/.claude/settings.local.json is tracked despite .claude/ being gitignored
      description: |-
        .gitignore ignores .claude/, but diagme/.claude/settings.local.json was
        committed before that rule existed, so git keeps tracking it. It holds only tool
        permissions — nothing sensitive — but the repo is public now and the state is
        inconsistent: the file is ignored everywhere except where it already exists.

        Decide one way or the other: `git rm --cached` it, or un-ignore it deliberately
        if the permissions are worth sharing.
      status: todo
