    - id: TH-4
      title: Push taskhound issues to GitHub Issues via the gh CLI
      description: |-
        A board is the right shape for planning work; GitHub Issues is where other
        people can see it. `th sync` should carry issues from the board to GitHub
        without turning into a second source of truth.

        What has to be decided, because none of it is free:

        - Identity. Re-running must update, not duplicate, so the GitHub number has to
          be remembered on the issue (a `github:` field).
        - Edges. GitHub has no native "blocked by" in the REST API, so edges become
          text in the body ("Blocked by #12"). That means filing in dependency order,
          blockers first, so the numbers exist to reference.
        - Status. todo/doing map to open, done to closed; `doing` probably wants a
          label so the distinction survives.
        - Comments. Fine to carry on create; carrying them on every update duplicates
          them unless each one is fingerprinted.
        - Preconditions. gh installed, authenticated, and a repo to target (from
          `gh repo view`, overridable with --repo).

        Acceptance criteria:
        - [ ] `th sync --dry-run` prints what it would create and update, touching nothing
        - [ ] running it twice creates no duplicates
        - [ ] a blocked issue's GitHub body references its blockers by number
        - [ ] closing an issue in taskhound closes it on GitHub on the next sync
      status: done
      created_at: 2026-09-02T08:34:04Z
      updated_at: 2026-09-02T08:39:24Z
      comments:
        - at: 2026-09-02T08:39:24Z
          author: lehel
          body: 'Built: one-way, idempotent via the gh CLI. All four acceptance criteria are covered by tests in sync_test.go, driving a fake gh so no network or token is needed.'
    - id: TH-5
      title: Render description markdown in the UI, edit as plain text
      description: |-
        Descriptions are markdown in practice — the to-tickets format is headings, prose
        and `- [ ]` acceptance criteria — but the drawer shows them as raw text in a
        textarea, so the structure is invisible until you read the asterisks.

        Show the rendered markdown by default; click it to get the plain text back in a
        textarea, blur to re-render. The textarea stays the single source of the value,
        so saving is unchanged.

        Reuse diagme's ~40-line `md()` renderer rather than writing a second one or
        pulling in a CDN. It escapes before it renders, so a description cannot inject
        markup. It needs one addition: `- [ ]` and `- [x]` task lists, which it does not
        handle and which every ticket description uses.

        - [ ] rendered by default, raw text on click, re-rendered on blur
        - [ ] headings, bold, italic, code, fences, ordered and unordered lists
        - [ ] `- [ ]` and `- [x]` render as checkboxes
        - [ ] a description containing markup is escaped, not executed
      status: done
      created_at: 2026-09-02T11:03:44Z
      updated_at: 2026-09-02T11:10:59Z
      comments:
        - at: 2026-09-02T11:10:59Z
          author: lehel
          body: 'Done. The renderer moved to mdlite/ as a shared tool; diagme and taskhound each hold a byte-identical copy because neither can reach outside its own directory (go:embed refuses .. and will not follow symlinks; nginx serves only diagme/app). Drift fails make -C mdlite check and a Go test. Rendering a real description turned up a bug the unit tests missed: hard-wrapped prose became one paragraph per line. Fixed with paragraph continuation, 11 tests now.'
