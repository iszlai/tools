<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskhound</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel-2: #232733; --line: #2f3441;
    --text: #e6e9ef; --dim: #929cb0; --accent: #6ea8fe; --ok: #64c98a;
    --warn: #e0a458; --stop: #e07a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .file { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }

  #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 14px; align-items: start; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 140px; }
  .col > h2 {
    margin: 0; padding: 9px 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;
  }
  .col.drop { outline: 1px dashed var(--accent); outline-offset: -3px; }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 6px; padding: 8px 10px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.blocked { border-left-color: var(--stop); }
  .card.ready { border-left-color: var(--ok); }
  .card.doing { border-left-color: var(--warn); }
  .card .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  .card .title { margin-top: 2px; }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; font-size: 11px; }
  .chip {
    background: #2b3040; border: 1px solid var(--line); border-radius: 10px;
    padding: 1px 7px; color: var(--dim); font-family: ui-monospace, monospace;
  }
  .chip.stop { color: var(--stop); border-color: #4a2f2f; }
  .chip.label { font-family: inherit; color: var(--accent); border-color: #2c3b57; }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%);
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto; display: none;
    box-shadow: -18px 0 40px rgba(0,0,0,.45);
  }
  #drawer.open { display: block; }
  #drawer h2 { margin: 0; font-size: 13px; color: var(--dim); font-family: ui-monospace, monospace; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px;
  }
  button.icon {
    border: none; background: none; color: var(--dim);
    font-size: 22px; line-height: 1; padding: 0 6px 3px;
  }
  button.icon:hover { color: var(--text); background: var(--panel-2); }
  label { display: block; margin: 12px 0 4px; font-size: 11px; text-transform: uppercase;
          letter-spacing: .07em; color: var(--dim); }
  input, textarea, select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }

  /* Rendered description. Click it to get the plain text back. */
  .md {
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    min-height: 110px; cursor: text; background: var(--bg);
  }
  .md:hover { border-color: var(--accent); }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3 { font-size: 14px; margin: 12px 0 6px; }
  .md h1 { font-size: 15px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md li.task { list-style: none; margin-left: -18px; }
  .md li.task input { width: auto; margin-right: 6px; vertical-align: -1px; }
  .md li.task.done { color: var(--dim); text-decoration: line-through; }
  .md code {
    background: #2b3040; border-radius: 3px; padding: 1px 4px;
    font-family: ui-monospace, monospace; font-size: 12px;
  }
  .md pre {
    background: #2b3040; border-radius: 5px; padding: 8px 10px; overflow-x: auto;
    font-family: ui-monospace, monospace; font-size: 12px; margin: 6px 0;
  }
  .md .placeholder { color: var(--dim); font-style: italic; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row > * { flex: 1; }
  .derived { font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace; }
  .comment { border-top: 1px solid var(--line); padding: 8px 0; }
  .comment .who { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }
  .comment .body { white-space: pre-wrap; }
  #err { color: var(--stop); margin-top: 10px; min-height: 18px; font-size: 13px; }
  .empty { color: var(--dim); padding: 10px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>taskhound</h1>
  <span class="file" id="file"></span>
  <span class="spacer"></span>
  <button class="primary" id="new">+ New issue</button>
</header>

<div id="board"></div>

<div id="drawer">
  <div class="drawer-head">
    <h2 id="d-id">New issue</h2>
    <button class="icon" id="close" title="Close (esc)" aria-label="Close">&times;</button>
  </div>
  <label for="d-title">Title</label>
  <input id="d-title" autocomplete="off">
  <label for="d-desc">Description <span class="derived">(markdown — click to edit)</span></label>
  <div class="md" id="d-desc-view"></div>
  <textarea id="d-desc" hidden></textarea>
  <label for="d-status">Status</label>
  <select id="d-status"></select>
  <label for="d-blocked">Blocked by <span class="derived">(ids, comma separated)</span></label>
  <input id="d-blocked" autocomplete="off" placeholder="TH-1, TH-2">
  <label for="d-labels">Labels <span class="derived">(comma separated)</span></label>
  <input id="d-labels" autocomplete="off">
  <label>Blocks</label>
  <div class="derived" id="d-blocks">-</div>
  <div id="err"></div>
  <div class="row">
    <button class="primary" id="save">Save</button>
    <button id="cancel">Close</button>
  </div>
  <div id="comments"></div>
  <div id="comment-box">
    <label for="d-comment">Add comment</label>
    <textarea id="d-comment" style="min-height:70px"></textarea>
    <div class="row"><button id="add-comment">Comment</button></div>
  </div>
</div>

<script src="/md.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLUMNS = [
  { key: 'blocked', name: 'Blocked', status: null },
  { key: 'ready',   name: 'Ready',   status: 'todo' },
  { key: 'doing',   name: 'Doing',   status: 'doing' },
  { key: 'done',    name: 'Done',    status: 'done' },
];

let board = { issues: [], statuses: ['todo', 'doing', 'done'] };
let editing = null;            // issue id, or '' while creating
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// Which column a card belongs in. Only "blocked" is derived — the other three
// are the issue's own status, which is what makes dragging meaningful.
function column(is) {
  if (is.status === 'done') return 'done';
  if (is.status === 'doing') return 'doing';
  return is.open_blockers.length ? 'blocked' : 'ready';
}

// The textarea holds the value; the rendered block is only ever a view of it,
// so saving does not care which one you are looking at. md() comes from
// mdlite/md.js, which escapes before it renders.
function showRendered() {
  const src = $('d-desc').value;
  $('d-desc-view').innerHTML = src.trim()
    ? md(src)
    : '<p class="placeholder">click to add a description\u2026</p>';
  $('d-desc-view').hidden = false;
  $('d-desc').hidden = true;
}

function showSource() {
  $('d-desc-view').hidden = true;
  $('d-desc').hidden = false;
  $('d-desc').focus();
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function refresh() {
  board = await api('GET', '/api/board');
  $('file').textContent = board.file;
  render();
}

function render() {
  $('board').innerHTML = COLUMNS.map(col => {
    const items = board.issues.filter(is => column(is) === col.key);
    const cards = items.map(card).join('') ||
      `<div class="empty">${col.key === 'blocked' ? 'nothing is waiting' : 'empty'}</div>`;
    return `<section class="col" data-col="${col.key}">
        <h2>${col.name}<span>${items.length}</span></h2>
        <div class="cards">${cards}</div>
      </section>`;
  }).join('');

  document.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDrawer(el.dataset.id);
    el.ondragstart = e => e.dataTransfer.setData('text/plain', el.dataset.id);
  });
  document.querySelectorAll('.col').forEach(el => {
    const target = COLUMNS.find(c => c.key === el.dataset.col).status;
    if (!target) return;                      // Blocked is derived, not a drop target
    el.ondragover = e => { e.preventDefault(); el.classList.add('drop'); };
    el.ondragleave = () => el.classList.remove('drop');
    el.ondrop = async e => {
      e.preventDefault();
      el.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain');
      try {
        await api('PATCH', `/api/issues/${id}`, { status: target });
        await refresh();
      } catch (err) { alert(err.message); }
    };
  });
}

function card(is) {
  const blockers = is.open_blockers.map(b => `<span class="chip stop">⛔ ${esc(b)}</span>`).join('');
  const blocks = is.blocks.length ? `<span class="chip">unblocks ${is.blocks.length}</span>` : '';
  const notes = is.comments?.length ? `<span class="chip">💬 ${is.comments.length}</span>` : '';
  const labels = (is.labels || []).map(l => `<span class="chip label">${esc(l)}</span>`).join('');
  return `<article class="card ${column(is)}" draggable="true" data-id="${esc(is.id)}">
      <div class="id">${esc(is.id)}</div>
      <div class="title">${esc(is.title)}</div>
      <div class="meta">${blockers}${blocks}${notes}${labels}</div>
    </article>`;
}

function openDrawer(id) {
  const is = board.issues.find(i => i.id === id);
  editing = id || '';
  $('d-id').textContent = is ? is.id : 'New issue';
  $('d-title').value = is ? is.title : '';
  $('d-desc').value = is ? (is.description || '') : '';
  showRendered();
  $('d-status').innerHTML = board.statuses
    .map(s => `<option ${is && is.status === s ? 'selected' : ''}>${s}</option>`).join('');
  $('d-blocked').value = is ? is.blocked_by.join(', ') : '';
  $('d-labels').value = is ? (is.labels || []).join(', ') : '';
  $('d-blocks').textContent = is && is.blocks.length ? is.blocks.join(', ') : '-';
  $('err').textContent = '';
  $('comment-box').style.display = is ? '' : 'none';
  $('comments').innerHTML = !is ? '' : (is.comments || []).map(c =>
    `<div class="comment"><div class="who">${esc(c.author || 'anon')} · ${esc(c.at)}</div>
     <div class="body">${esc(c.body)}</div></div>`).join('');
  $('drawer').classList.add('open');
  $('d-title').focus();
}

function closeDrawer() { editing = null; $('drawer').classList.remove('open'); }

const list = v => v.split(',').map(s => s.trim()).filter(Boolean);

async function save() {
  const payload = {
    title: $('d-title').value.trim(),
    description: $('d-desc').value,
    status: $('d-status').value,
    blocked_by: list($('d-blocked').value),
    labels: list($('d-labels').value),
  };
  try {
    if (editing) await api('PATCH', `/api/issues/${editing}`, payload);
    else await api('POST', '/api/issues', payload);
    closeDrawer();
    await refresh();
  } catch (err) { $('err').textContent = err.message; }
}

async function addComment() {
  const body = $('d-comment').value.trim();
  if (!body || !editing) return;
  try {
    await api('POST', `/api/issues/${editing}/comments`, { body });
    $('d-comment').value = '';
    const id = editing;
    await refresh();
    openDrawer(id);
  } catch (err) { $('err').textContent = err.message; }
}

$('close').onclick = closeDrawer;
$('d-desc-view').onclick = showSource;
$('d-desc').onblur = showRendered;
$('new').onclick = () => openDrawer(null);
$('save').onclick = save;
$('cancel').onclick = closeDrawer;
$('add-comment').onclick = addComment;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

refresh().catch(err => document.body.insertAdjacentHTML('afterbegin',
  `<p style="color:#e07a7a;padding:16px">${esc(err.message)}</p>`));
// Polling keeps the board fresh when the CLI or another instance edits the
// file, but never while the drawer is open — that would stomp on typing.
setInterval(() => { if (editing === null) refresh().catch(() => {}); }, 2000);
</script>
</body>
</html>
