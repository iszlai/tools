<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FlowReview</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/styles/chroma.css">
</head>
<body>
<!-- FR-7: progress lives in a thin header above the three panes, separate
     from the richer session summary in the right pane (title, per-type
     counts, comments, source/head). -->
<header id="topbar" aria-label="Session progress">
  <span id="topbar-title"></span>
  <div class="progress-bar" id="topbar-progress"><div></div></div>
  <span id="topbar-count"></span>
  <!-- Every keyboard shortcut also has a clickable control here or on its
       own row (see app.js's rowCellsHTML for the per-hunk ones) -- title
       names the action and its key, so a glyph-only button stays legible. -->
  <div id="toolbar" role="toolbar" aria-label="Actions">
    <button id="tb-prev-file" type="button" title="Previous file (k)">◀</button>
    <button id="tb-next-file" type="button" title="Next file (j)">▶</button>
    <button id="tb-prev-hunk" type="button" title="Previous hunk (p)">▲</button>
    <button id="tb-next-hunk" type="button" title="Next hunk (n)">▼</button>
    <button id="tb-file-reviewed" type="button" title="Toggle whole file reviewed (R)">✓ File</button>
    <button id="order-toggle" type="button"></button>
    <button id="wrap-toggle" type="button"></button>
    <button id="layout-toggle" type="button"></button>
  </div>
  <button id="help-button" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
</header>
<div id="app">
  <nav id="files" aria-label="Changed files"></nav>
  <!-- Drag to resize the file list; the embedded button collapses/expands it
       (persisted in localStorage, see app.js's applyPaneLayout) -- a visible
       control for the pane-edge action, not just a drag gesture. -->
  <div id="files-resizer" class="pane-resizer" title="Drag to resize the file list (double-click to reset)">
    <button id="files-toggle" type="button" title="Collapse file list ([)">«</button>
  </div>
  <main id="diff" aria-label="Diff"></main>
  <div id="side-resizer" class="pane-resizer" title="Drag to resize the sidebar (double-click to reset)">
    <button id="side-toggle" type="button" title="Collapse sidebar (])">»</button>
  </div>
  <aside id="side" aria-label="Session summary and comments">
    <div id="session-summary">Loading…</div>
    <!-- FR-19: blast radius for the focused hunk's changed function(s) --
         unchanged callers, call sites and implementers (see app.js's
         renderCallersPanel). Hidden entirely when the source has nothing for
         radius to report (non-Go diff, or a patch with no old revision). -->
    <div id="callers-panel" hidden>
      <h3>Callers</h3>
      <div id="callers-content"></div>
    </div>
    <!-- FR-21: which tests reach the focused hunk's changed function(s),
         plus a copyable `go test` command (see app.js's renderTestsPanel). -->
    <div id="tests-panel" hidden>
      <h3>Tests</h3>
      <div id="tests-content"></div>
    </div>
    <!-- FR-9: comment drafts live here, not inline in the virtualized diff
         rows -- see app.js's FR-9 section comment for why. -->
    <div id="comments-panel">
      <h3>Comments</h3>
      <button id="add-general-comment" type="button">+ General comment</button>
      <div id="comment-list"></div>
      <!-- FR-11: submit the session's own drafts as a GitHub review. Only
           shown for a PR session (toggled in app.js's renderPublishPanel). -->
      <div id="publish-panel" hidden>
        <h3>Submit review</h3>
        <textarea id="publish-body" placeholder="Review summary (optional)"></textarea>
        <select id="publish-event">
          <option value="COMMENT">Comment</option>
          <option value="APPROVE">Approve</option>
          <option value="REQUEST_CHANGES">Request changes</option>
        </select>
        <div class="actions">
          <button id="publish-preview" type="button">Preview</button>
          <button id="publish-submit" type="button">Submit</button>
        </div>
        <div id="publish-preflight"></div>
        <div id="publish-confirm" hidden>
          <p id="publish-confirm-summary"></p>
          <div class="actions">
            <button id="publish-confirm-yes" type="button">Yes, submit</button>
            <button id="publish-confirm-no" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <h3>Outdated remote comments</h3>
      <div id="remote-comment-list"></div>
    </div>
  </aside>
</div>
<div id="help-overlay" hidden></div>
<script src="md.js"></script>
<script src="app.js"></script>
<script src="summary.js"></script>
</body>
</html>
