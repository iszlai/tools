<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FlowReview</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/styles/chroma.css">
</head>
<body>
<!-- FR-7: progress lives in a thin header above the three panes, separate
     from the richer session summary in the right pane (title, per-type
     counts, comments, source/head). -->
<header id="topbar" aria-label="Session progress">
  <span id="topbar-title"></span>
  <div class="progress-bar" id="topbar-progress"><div></div></div>
  <span id="topbar-count"></span>
  <!-- FR-29: visible on/off for hunk summaries, not just the 's' shortcut -- summary.js wires it up. -->
  <button id="summary-toggle-button" type="button" title="Toggle hunk summaries (s)" aria-label="Toggle hunk summaries" aria-pressed="true">✦</button>
  <button id="help-button" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
</header>
<div id="app">
  <nav id="files" aria-label="Changed files"></nav>
  <main id="diff" aria-label="Diff"></main>
  <aside id="side" aria-label="Session summary and comments">
    <div id="session-summary">Loading…</div>
    <!-- FR-9: comment drafts live here, not inline in the virtualized diff
         rows -- see app.js's FR-9 section comment for why. -->
    <div id="comments-panel">
      <h3>Comments</h3>
      <button id="add-general-comment" type="button">+ General comment</button>
      <div id="comment-list"></div>
      <!-- FR-11: submit the session's own drafts as a GitHub review. Only
           shown for a PR session (toggled in app.js's renderPublishPanel). -->
      <div id="publish-panel" hidden>
        <h3>Submit review</h3>
        <textarea id="publish-body" placeholder="Review summary (optional)"></textarea>
        <select id="publish-event">
          <option value="COMMENT">Comment</option>
          <option value="APPROVE">Approve</option>
          <option value="REQUEST_CHANGES">Request changes</option>
        </select>
        <div class="actions">
          <button id="publish-preview" type="button">Preview</button>
          <button id="publish-submit" type="button">Submit</button>
        </div>
        <div id="publish-preflight"></div>
        <div id="publish-confirm" hidden>
          <p id="publish-confirm-summary"></p>
          <div class="actions">
            <button id="publish-confirm-yes" type="button">Yes, submit</button>
            <button id="publish-confirm-no" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <h3>Outdated remote comments</h3>
      <div id="remote-comment-list"></div>
    </div>
  </aside>
</div>
<div id="help-overlay" hidden></div>
<script src="md.js"></script>
<script src="app.js"></script>
<script src="summary.js"></script>
</body>
</html>
